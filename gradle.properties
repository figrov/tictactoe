# --- Оптимизация памяти JVM под облачные раннеры (7 GB RAM) ---
# Выделяем 3 ГБ под Gradle-демон и ограничиваем Metaspace, чтобы не упереться в лимит памяти контейнера
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Включаем Gradle Daemon (ускоряет повторные прогоны у локального агента android-dev)
org.gradle.daemon=true

# --- Ускорение сборки и кэширование ---
# Параллельная сборка модулей
org.gradle.parallel=true

# Локальный и CI Build Cache (в связке с gradle/actions/setup-gradle@v4 экономит до 50% времени)
org.gradle.caching=true

# Кэширование конфигурации Gradle (пропускает фазу настройки, если build.gradle.kts не менялись)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Оптимизация Android и Kotlin ---
android.useAndroidX=true
kotlin.code.style=official

# Ускорение компиляции Kotlin за счет вынесения в отдельный процесс с контролем памяти
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Отключаем генерацию лишнего BuildConfig и неиспользуемых ресурсов по умолчанию (ускоряет сборку)
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
