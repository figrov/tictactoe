name: Telegram Standup Reports

on:
  push:
    paths:
      - 'docs/reports/*.md'
      - 'docs/qa/*.md'

jobs:
  send-report:
    name: Send Agent Report to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed reports and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - << 'EOF'
          import os, subprocess, urllib.request, urllib.error, json

          raw_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          token = raw_token.strip().strip('"').strip("'").removeprefix("bot")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip().strip('"').strip("'")
          branch = os.environ["BRANCH_NAME"]
          sha = os.environ["COMMIT_SHA"][:7]

          if not token or not chat_id:
              raise RuntimeError("ОШИБКА: TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID пустые!")

          diff = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD", "--", "docs/reports/", "docs/qa/"],
              text=True
          ).strip().splitlines()

          if not diff:
              print("Изменений в отчетах и протоколах QA не найдено.")
              exit(0)

          host = "api." + "telegram.org"
          url = f"https://{host}/bot{token}/sendMessage"

          def send_tg(text_chunk):
              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": text_chunk
              }).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                      if not body.get("ok"):
                          raise RuntimeError(f"Telegram API error: {body}")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"Telegram HTTP {e.code}: {err_body}")

          for file_path in diff:
              if not os.path.exists(file_path):
                  continue

              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read().strip()

              if not content:
                  continue

              header = f"🌿 Ветка: {branch} ({sha})\n📄 Файл: {file_path}\n\n"
              full_text = header + content

              for i in range(0, len(full_text), 3900):
                  send_tg(full_text[i:i+3900])

              print(f"Успешно отправлен файл {file_path}")
          EOF